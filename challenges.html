                        win: "🎉 Nailed it! Great Event Managers always have a Plan B ready.",
                        lose: "☔ Think about planning ahead for unexpected surprises!"

                    {

                        intro: "Hotel and Tourism Managers create welcoming experiences for travellers.",
                        question: "If a hotel has 80 rooms and 60 rooms are booked tonight, how many rooms are still available?",
                        type: "text",
                        answers: ["20", "20 ROOMS"],
                        win: "🏨 Spot on! 80 total rooms minus 60 booked = 20 rooms free.",
                        lose: "🧮 Subtract 60 from 80!"

            },
            social: {
                title: "Social Sciences",
                items: [
                    {
                        heading: "1. 🏺 Archaeologist & Historian",
                        intro: "Archaeologists and Historians uncover evidence of past human civilisations.",
                        question: "What do Archaeologists call human-made objects—like ancient pottery or tools—found during a dig?",
                        type: "mcq",

                        lose: "🔍 Look for the word starting with 'Art...' used for ancient objects!"

                    {

                        intro: "Geographers study Earth's landscapes, climates, and human populations.",
                        question: "What imaginary line at 0° latitude divides Earth into the Northern and Southern Hemispheres?",

                        options: [

                        intro: "Translators help people across cultures communicate clearly.",
                        question: "What 8-letter word describes someone who can speak two languages fluently? (Starts with B)",
                        type: "text",
                        answers: ["BILINGUAL"],
                        win: "🗣️ Brilliant! Being bilingual opens doors across global careers and cultures.",

        let currentCatKey = "technology";
        let solvedTracker = {};

        function selectChallengeCategory(catKey, btn) {
            currentCatKey = catKey;
            solvedTracker = {};

            document.querySelectorAll(".career-filters .filter-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");

            const catData = careerChallenges[catKey];
            document.getElementById("active-cat-title").textContent = catData.title;
            document.getElementById("cat-score").textContent = "0";

            const listEl = document.getElementById("challenge-list");
            listEl.innerHTML = "";

            catData.items.forEach((item, idx) => {
                const wrapper = document.createElement("div");
                wrapper.className = "challenge";
                wrapper.style.marginBottom = "2rem";

                let controlsHTML = "";
                if (item.type === "mcq") {
                    controlsHTML = item.options.map(opt =>
                        `<button type="button" class="button" onclick="checkChallengeMCQ(${idx}, ${opt.correct})">${opt.text}</button>`
                    ).join(" ");
                } else {
                    controlsHTML = `
                        <input type="text" id="chal-input-${idx}" class="answer-input" placeholder="${item.promptPlaceholder || 'Type your answer...'}">
                        <button type="button" class="button pink" onclick="checkChallengeText(${idx})">Check Answer ✨</button>
                    `;
                }

                const codeHTML = item.code
                    ? `<pre class="code-snippet">${item.code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`
                    : "";

                wrapper.innerHTML = `
                    <h3>${item.heading}</h3>
                    <p style="margin-bottom: 1rem;">${item.intro}</p>
                    <p><strong>${item.question}</strong></p>
                    ${codeHTML}
                    <div style="margin-top: 1rem;">${controlsHTML}</div>
                    <p id="chal-msg-${idx}" class="feedback-msg" aria-live="polite"></p>
                `;

                listEl.appendChild(wrapper);
            });
        }

        function checkChallengeMCQ(idx, isCorrect) {
            const item = careerChallenges[currentCatKey].items[idx];
            const msgEl = document.getElementById("chal-msg-" + idx);

            if (isCorrect) {
                msgEl.textContent = item.win;
                msgEl.style.color = "#059669";
                solvedTracker[idx] = true;
                document.getElementById("cat-score").textContent = Object.keys(solvedTracker).length;
            } else {
                msgEl.textContent = item.lose;
                msgEl.style.color = "#db2777";
            }
        }

        function checkChallengeText(idx) {
            const item = careerChallenges[currentCatKey].items[idx];
            const inputEl = document.getElementById("chal-input-" + idx);
            const msgEl = document.getElementById("chal-msg-" + idx);
            const userVal = inputEl.value.trim().toUpperCase();

            if (!userVal) {
                msgEl.textContent = "✏️ Type your answer in the box first!";
                msgEl.style.color = "#475569";
            } else if (item.answers.includes(userVal)) {
                msgEl.textContent = item.win;
                msgEl.style.color = "#059669";
                solvedTracker[idx] = true;
                document.getElementById("cat-score").textContent = Object.keys(solvedTracker).length;
            } else {
                msgEl.textContent = item.lose;
                msgEl.style.color = "#db2777";
            }
        }

        // Load Technology challenges by default when page opens
        selectChallengeCategory("technology", document.querySelector(".career-filters .filter-btn"));
    </script>
</body>
</html>
